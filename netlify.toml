[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the build image to a stable LTS so the SSR build + prerender run
  # the same way CI does locally.
  NODE_VERSION = "22"

# Send the default Netlify hostname to the live domain. This kills the duplicate
# copy of the site at biglongfarmhouse.netlify.app and keeps it out of analytics.
# Deploy Previews and branch deploys use a prefixed host
# (deploy-preview-N--biglongfarmhouse.netlify.app) so they are unaffected.
# Must stay above the SPA fallback — Netlify applies the first matching rule.
[[redirects]]
  from = "https://biglongfarmhouse.netlify.app/*"
  to = "https://biglongfarmhouse.com/:splat"
  status = 301
  force = true

# SPA fallback. Prerendered routes (/, /about, /big-long-lake) exist as flat
# static files (about.html, big-long-lake.html) and are served directly at their
# slash-less paths by pretty_urls; /welcome and any unknown path fall through to
# the client-rendered app (this is what keeps /welcome noindexed + private).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
